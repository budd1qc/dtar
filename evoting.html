.av{width:48px;height:48px;border-radius:12px;object-fit:cover;flex:none;background:#e2e8f0}.bar{height:9px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin:5px 0 12px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#0f766e,#14b8a6);min-width:2px;border-radius:99px}.cam{position:relative;background:#020617;border-radius:16px;overflow:hidden}.cam video{width:100%;display:block;transform:scaleX(-1)}.cam img{width:100%;display:block}

.backdrop{position:absolute;inset:0;z-index:200;display:flex;align-items:flex-end;background:rgba(15,23,42,.60);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}.backdrop.hidden,#loading.hidden{display:none!important}.sheet{width:100%;max-height:92%;overflow-y:auto;background:#fff;border-radius:26px 26px 0 0;padding:22px 18px max(20px,env(safe-area-inset-bottom));box-shadow:0 -14px 40px rgba(15,23,42,.22);animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
#loading{position:absolute;inset:0;z-index:150;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,255,255,.80);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}#toast{position:absolute;top:80px;left:50%;transform:translateX(-50%);z-index:300;pointer-events:none;background:#1e293b;color:#fff;padding:8px 16px;border-radius:99px;font-size:13px;font-weight:600;opacity:0;transition:opacity .3s;max-width:90%;text-align:center}
.rv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #f1f5f9;font-size:13px}.rv span{color:#64748b}.rv b{text-align:right}.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:99px;font-size:10px;font-weight:700}.tbl{border-collapse:collapse;width:100%;font-size:11px}.tbl th,.tbl td{border-bottom:1px solid #e2e8f0;padding:8px;text-align:left;white-space:nowrap}

@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}.pop{animation:pop .42s cubic-bezier(.2,1.4,.4,1)}

<script>
// KONFIGURASI APLIKASI
const IS_PREVIEW = false; // true = mode preview data dummy
const GAS_URL = "https://script.google.com/macros/s/AKfycbzetRy9FSo09UU5uGZlEqsppABDizNozOd1Bf7C6Qu3tqJc3DWuif8o2-mVsNfBWuGl/exec";

(function(){
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S={view:'home',calon:[],gang:[],st:null,token:'',tab:'dash',off:0,ad:null,ef:{}};
const V={step:0,nama:'',gang:'',rumah:'',wa:'',calon:'',photo:''};
let stream=null,loop=null,faceOK=false,libOK=false,tick=null,poll=null,lc=0;

/* ===== DATA DUMMY (PREVIEW) ===== */
function ph(t){return 'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400"><rect width="400" height="400" fill="#0f766e"/><text x="200" y="240" font-size="140" text-anchor="middle" fill="#fff" font-family="sans-serif">'+t+'</text></svg>')}
const D={calon:[{id:'C1',nama:'H. Ahmad Fauzi',visi:'Lingkungan bersih dan aman.\nRonda aktif tiap malam.',foto:ph('A')},{id:'C2',nama:'Budi Santoso',visi:'Transparansi iuran warga.\nPerbaikan drainase.',foto:ph('B')},{id:'C3',nama:'Siti Rahmawati',visi:'Taman bermain dan kegiatan pemuda.',foto:ph('S')}],
gang:['Gang Mawar','Gang Melati','Gang Anggrek'],votes:[{ts:'05/10/2026 08:10',gang:'Gang Mawar',rumah:'1',wa:'6281200000001',calon:'C1',foto:'#'},{ts:'05/10/2026 09:30',gang:'Gang Melati',rumah:'7',wa:'6281200000002',calon:'C2',foto:'#'}],deadline:new Date(Date.now()+864e5).toISOString()};
const nk=(g,r)=>g+'|'+String(r).toUpperCase().replace(/\s+/g,'');
function normWA(w){w=String(w).replace(/\D/g,'');if(w.startsWith('0'))w='62'+w.slice(1);return /^628\d{8,12}$/.test(w)?w:''}
function pg(){const t=D.votes.length;return D.gang.map(g=>{const n=D.votes.filter(v=>v.gang==g).length;return{nama:g,suara:n,persen:t?+(n*100/t).toFixed(1):0}}).sort((a,b)=>b.suara-a.suara)}
function res(){const t=D.votes.length;return D.calon.map(c=>{const n=D.votes.filter(v=>v.calon==c.id).length;return{id:c.id,nama:c.nama,foto:c.foto,suara:n,persen:t?+(n*100/t).toFixed(1):0}})}
function mock(a,d){
 const fin=Date.now()>=new Date(D.deadline).getTime();
 switch(a){
 case 'getPublic':return{ok:true,calon:D.calon,gang:D.gang};
 case 'getStatus':return{ok:true,total:D.votes.length,deadline:D.deadline,now:new Date().toISOString(),finished:fin,results:fin?res():[],perGang:pg()};
 case 'submitVote':{if(fin)return{ok:false,msg:'Pemilihan sudah ditutup.'};const w=normWA(d.wa);if(!w)return{ok:false,msg:'Nomor WhatsApp tidak valid.'};
  if(D.votes.some(v=>nk(v.gang,v.rumah)==nk(d.gang,d.rumah)))return{ok:false,msg:'Rumah ini sudah menggunakan hak suaranya.'};
  if(D.votes.some(v=>v.wa==w))return{ok:false,msg:'Nomor WhatsApp ini sudah digunakan untuk memilih.'};
  D.votes.push({ts:new Date().toLocaleString('id-ID'),nama:d.nama,gang:d.gang,rumah:d.rumah,wa:w,calon:d.calon,foto:d.foto});return{ok:true}}
 case 'adminLogin':return d.u==='admin'&&d.p==='edudigital'?{ok:true,token:'PREVIEW'}:{ok:false,msg:'Username atau password salah.'};
 case 'adminData':return{ok:true,total:D.votes.length,results:res(),perGang:pg(),calon:D.calon,gang:D.gang,deadline:D.deadline,log:D.votes.slice().reverse().map(v=>({ts:v.ts,nama:v.nama||'-',gang:v.gang,rumah:v.rumah,wa:v.wa,calon:(D.calon.find(c=>c.id==v.calon)||{}).nama||v.calon,foto:v.foto}))};
 case 'saveCalon':{let c=D.calon.find(x=>x.id==d.id);if(!c){c={id:'C'+(Date.now()%100000)};D.calon.push(c)}c.nama=d.nama;c.visi=d.visi;if(d.fotoData)c.foto=d.fotoData;else if(!c.foto)c.foto=ph(d.nama[0]);return{ok:true}}
 case 'deleteCalon':if(D.votes.some(v=>v.calon==d.id))return{ok:false,msg:'Calon sudah punya suara, tidak bisa dihapus.'};D.calon=D.calon.filter(c=>c.id!=d.id);return{ok:true};
 case 'addGang':if(D.gang.includes(d.nama))return{ok:false,msg:'Gang sudah ada.'};D.gang.push(d.nama);return{ok:true};
 case 'deleteGang':D.gang=D.gang.filter(g=>g!=d.nama);return{ok:true};
 case 'saveSetting':D.deadline=d.value;return{ok:true};
 }return{ok:false,msg:'Aksi tidak dikenal'}}

/* ===== UTIL ===== */
function loading(on){lc=Math.max(0,lc+(on?1:-1));$('loading').classList.toggle('hidden',lc===0)}
async function api(action,data,quiet){
 data=data||{};if(!quiet)loading(true);
 try{
  if(IS_PREVIEW){await new Promise(r=>setTimeout(r,250));return mock(action,data)}
  const r=await fetch(GAS_URL,{method:'POST',body:JSON.stringify(Object.assign({action:action,token:S.token},data))});return await r.json()
 }catch(e){return{ok:false,msg:'Gagal terhubung ke server. Periksa koneksi.'}}
 finally{if(!quiet)loading(false)}}
function toast(m){const t=$('toast');t.textContent=m;t.style.opacity=1;clearTimeout(toast._t);toast._t=setTimeout(()=>t.style.opacity=0,2800)}
function sheet(h){$('sheetc').innerHTML=h;$('sheet').classList.remove('hidden')}
function closeSheet(){$('sheet').classList.add('hidden')}
function readImg(file,max){return new Promise(res=>{const fr=new FileReader();fr.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height));const c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8))};i.src=fr.result};fr.readAsDataURL(file)})}
function localInput(iso){const d=new Date(iso),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())}
function bars(r){return r.length?r.map(c=>'<div class="flex justify-between text-xs font-bold text-slate-700"><span>'+esc(c.nama)+'</span><span class="text-teal-700">'+c.persen+'% <span class="text-slate-400">('+c.suara+')</span></span></div><div class="bar"><i style="width:'+c.persen+'%"></i></div>').join(''):'<p class="text-xs text-slate-400 text-center">Belum ada data.</p>'}
const T=(t,s)=>'<div class="px-1"><p class="text-[10px] uppercase tracking-[.12em] font-bold text-slate-400">'+(s||'')+'</p><h2 class="font-bold text-slate-800 text-base">'+t+'</h2></div>';
const P=(a,b)=>'<div class="gc p-4">'+a+'</div>';
function calonCard(c,hl){return '<div class="gc p-3 flex gap-3" '+(hl?'style="border-color:#14b8a6"':'')+'><img class="av" style="width:64px;height:64px" src="'+esc(c.foto)+'" alt=""><div class="min-w-0"><h3 class="font-bold text-sm text-slate-800">'+esc(c.nama)+'</h3><p class="text-xs text-slate-500 mt-1" style="white-space:pre-line">'+esc(c.visi)+'</p></div></div>'}

/* ===== NAV & RENDER ===== */
function go(v){stopCam();clearInterval(tick);clearInterval(poll);S.view=v;if(v==='vote'){if(V.step===4)V.step=0;loadStatus()}render();if(v==='wait'){loadStatus();poll=setInterval(()=>loadStatus(true),20000);tick=setInterval(tickCd,1000)}}
function navHtml(){
 const adm=S.view==='admin',B=(k,i,t,on,attr)=>'<button type="button" class="nav-btn'+(on?' on':'')+'" '+attr+'="'+k+'"><i class="fa-solid fa-'+i+' text-xl mb-1"></i><span class="text-[10px] font-semibold">'+t+'</span></button>';
 if(adm)return [['dash','chart-pie','Dashboard'],['calon','user-tie','Calon'],['gang','house-flag','Gang'],['log','clipboard-list','Log'],['waktu','clock','Waktu']].map(t=>B(t[0],t[1],t[2],S.tab===t[0],'data-t')).join('');
 return [['home','house','Beranda'],['vote','check-to-slot','Vote'],['wait','chart-simple','Status'],['login','lock','Panitia']].map(t=>B(t[0],t[1],t[2],S.view===t[0]||(t[0]==='login'&&S.view==='login'),'data-g')).join('')}
function render(){
 $('nav').innerHTML=navHtml();
 const m=$('main');
 m.innerHTML=S.view==='home'?vHome():S.view==='vote'?vVote():S.view==='wait'?vWait():S.view==='login'?vLogin():vAdmin();
 m.scrollTop=0;
 if(S.view==='vote'&&V.step===1&&!V.photo)startCam();
 if(S.view==='wait')tickCd()}

/* ===== VIEW WARGA ===== */
function fmtDl(){const s=S.st;if(!s)return '...';const d=new Date(s.deadline);return d.toLocaleDateString('id-ID',{timeZone:'Asia/Jakarta',weekday:'long',day:'numeric',month:'long',year:'numeric'})+' pukul '+d.toLocaleTimeString('id-ID',{timeZone:'Asia/Jakarta',hour:'2-digit',minute:'2-digit',hour12:false}).replace(':','.')+' WIB'}
function vHome(){
 const total=S.calon.length;
 return '<div class="hero"><div class="hero-icon"><i class="fa-solid fa-check-to-slot text-xl"></i></div><div class="text-[10px] font-bold uppercase tracking-[.12em] opacity-75">E-Voting Warga</div><h2 class="text-[23px] font-extrabold leading-tight mt-1">Suara Anda Menentukan</h2><p class="text-sm opacity-90 mt-1 mb-5">Pemilihan Ketua Perumahan De Tanjung Raya</p><button class="btn" data-a="tovote" style="background:#fff;color:#0f766e;box-shadow:none"><i class="fa-solid fa-arrow-right"></i>Mulai Memilih</button></div>'
 +'<div class="grid grid-cols-2 gap-3"><div class="mini-stat"><b>'+total+'</b><span>CALON KETUA</span></div><div class="mini-stat"><b><i class="fa-solid fa-shield-halved text-lg"></i></b><span>PEMILIHAN AMAN</span></div></div>'
 +T('Calon Ketua','Kenali Kandidat')+(S.calon.length?S.calon.map(c=>calonCard(c)).join(''):'<div class="gc p-5 text-center text-sm text-slate-500">Belum ada data calon.</div>')}

function stepper(n){const L=['Wajah','Data','Periksa'];return '<div class="gc p-3 flex items-center justify-between">'+L.map((l,i)=>'<div class="flex items-center gap-2 '+(i<2?'flex-1':'')+'"><span class="w-7 h-7 rounded-full flex items-center justify-center text-[11px] font-extrabold '+(n>i+1?'bg-teal-600 text-white':n===i+1?'bg-teal-100 text-teal-700 ring-2 ring-teal-500':'bg-slate-100 text-slate-400')+'">'+(n>i+1?'<i class="fa-solid fa-check"></i>':i+1)+'</span><span class="text-[10px] font-bold '+(n===i+1?'text-teal-700':'text-slate-400')+'">'+l+'</span>'+(i<2?'<span class="flex-1 h-px bg-slate-200"></span>':'')+'</div>').join('')+'</div>'}
function vVote(){
 const cal=S.calon.find(c=>c.id===V.calon)||{};
 if(V.step===0){const closed=S.st&&S.st.finished;
  return T('Peraturan & Alur','Sebelum Memilih')+'<div class="gc p-4"><h3 class="font-bold text-sm text-slate-800 mb-2"><i class="fa-solid fa-scale-balanced text-teal-600 mr-2"></i>Ketentuan</h3><ol class="text-xs text-slate-600 space-y-2 pl-4" style="list-style:decimal"><li>Pemilih adalah <b>warga Perumahan De Tanjung Raya</b>.</li><li><b>1 rumah memiliki 1 hak suara.</b> Satu nomor WhatsApp hanya dapat dipakai sekali.</li><li>Data yang diisi harus benar sesuai identitas dan alamat Anda.</li><li>Suara yang sudah dikirim <b>tidak dapat diubah</b>.</li></ol></div>'
  +'<div class="gc p-4"><h3 class="font-bold text-sm text-slate-800 mb-2"><i class="fa-solid fa-list-check text-teal-600 mr-2"></i>Alur Memilih</h3><ol class="text-xs text-slate-600 space-y-2 pl-4" style="list-style:decimal"><li>Verifikasi wajah lewat kamera</li><li>Isi data diri dan pilih calon</li><li>Periksa kembali data dan pilihan</li><li>Konfirmasi dan kirim suara</li></ol></div>'
  +'<div class="gc p-4 bg-teal-50"><h3 class="font-bold text-sm text-teal-800 mb-1"><i class="fa-solid fa-bullhorn mr-2"></i>Pengumuman Hasil</h3><p class="text-xs text-teal-900">'+(closed?'Pemilihan sudah ditutup. Hasil telah diumumkan di menu Status.':'Hasil diumumkan pada <b>'+esc(fmtDl())+'</b>.')+'</p></div>'
  +(closed?'':'<button class="btn" data-a="start">Saya Mengerti, Lanjut Memilih<i class="fa-solid fa-arrow-right"></i></button>')}
 if(V.step===1)return stepper(1)+T('Verifikasi Wajah','Langkah 1')+'<div class="gc p-4"><div class="cam">'+(V.photo?'<img src="'+V.photo+'" alt="">':'<video id="vid" autoplay playsinline muted></video>')+'</div><div class="text-center font-bold text-sm py-3 text-slate-500" id="msg">'+(V.photo?'<span class="text-emerald-600">Foto siap digunakan</span>':'Menyiapkan...')+'</div>'+(V.photo?'<button class="btn" data-a="tofrm">Lanjut Isi Form<i class="fa-solid fa-arrow-right"></i></button><button class="btn sec mt-2" data-a="retake"><i class="fa-solid fa-rotate"></i>Foto Ulang</button>':'<button class="btn" id="bc" data-a="shot" disabled><i class="fa-solid fa-camera"></i>Ambil Foto</button><button class="btn sec mt-2" data-a="back">Kembali</button>')+'</div>';
 if(V.step===2)return stepper(2)+T('Form Pemilihan','Langkah 2')+'<div class="gc p-4"><label class="fl" style="margin-top:0">Nama Lengkap</label><input class="inp" id="fn" value="'+esc(V.nama)+'" placeholder="Sesuai identitas" autocomplete="name"><label class="fl">Nama Gang</label><select class="inp" id="fg"><option value="">- Pilih gang -</option>'+S.gang.map(g=>'<option'+(V.gang===g?' selected':'')+'>'+esc(g)+'</option>').join('')+'</select><label class="fl">Nomor Rumah</label><input class="inp" id="fr" value="'+esc(V.rumah)+'" placeholder="Contoh: 12A"><label class="fl">No WhatsApp</label><input class="inp" id="fw" type="tel" inputmode="numeric" value="'+esc(V.wa)+'" placeholder="08xxxxxxxxxx"><label class="fl">Pilih Calon Ketua</label>'+S.calon.map(c=>'<label class="opt'+(V.calon===c.id?' on':'')+'"><input type="radio" name="fc" value="'+esc(c.id)+'"'+(V.calon===c.id?' checked':'')+'><img class="av" src="'+esc(c.foto)+'" alt=""><span class="flex-1 font-bold text-sm text-slate-800">'+esc(c.nama)+'</span><i class="fa-solid fa-circle-check text-lg '+(V.calon===c.id?'text-teal-600':'text-slate-200')+'"></i></label>').join('')+'<button class="btn mt-3" data-a="review">Lanjut Periksa Pilihan<i class="fa-solid fa-arrow-right"></i></button><button class="btn sec mt-2" data-a="back">Kembali ke Foto</button></div>';
 if(V.step===3)return stepper(3)+T('Periksa Pilihan Anda','Langkah 3')+'<div class="gc p-4"><div class="cam" style="max-height:180px"><img src="'+V.photo+'" alt="" style="object-fit:cover;max-height:180px"></div><div class="mt-2"><div class="rv"><span>Nama</span><b>'+esc(V.nama)+'</b></div><div class="rv"><span>Gang</span><b>'+esc(V.gang)+'</b></div><div class="rv"><span>No Rumah</span><b>'+esc(V.rumah)+'</b></div><div class="rv"><span>WhatsApp</span><b>'+esc(V.wa)+'</b></div></div></div><p class="text-[10px] font-bold uppercase tracking-wide text-slate-400 px-1">Calon yang Anda pilih</p>'+calonCard(cal,1)+'<button class="btn" data-a="send"><i class="fa-solid fa-paper-plane"></i>Konfirmasi &amp; Kirim Suara</button><button class="btn sec" data-a="edit">Ubah Data</button>';
 return '<div class="gc p-6 text-center mt-6"><div class="w-20 h-20 mx-auto rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-4xl pop" style="box-shadow:0 0 0 10px #ecfdf5"><i class="fa-solid fa-check"></i></div><h2 class="text-xl font-extrabold text-slate-800 mt-5">Suara Anda Tercatat</h2><p class="text-xs text-slate-500 mt-1 mb-5">Terima kasih telah berpartisipasi dalam pemilihan.</p><button class="btn" data-a="towait"><i class="fa-solid fa-chart-simple"></i>Lihat Status Pemilihan</button></div>'}
function vWait(){
 const s=S.st;if(!s)return '<div class="gc p-6 text-center text-sm text-slate-500"><i class="fa-solid fa-spinner fa-spin text-teal-600 mr-2"></i>Memuat...</div>';
 let h='<div class="gc p-5 text-center"><p class="text-[10px] uppercase tracking-wide font-bold text-slate-400">Total Pemilih Masuk</p><p class="text-5xl font-extrabold text-teal-600 mt-1">'+s.total+'</p></div>';
 const g='<div class="gc p-4"><h3 class="font-bold text-sm text-slate-800 mb-3"><i class="fa-solid fa-house-flag text-teal-600 mr-2"></i>Suara Masuk per Gang</h3>'+bars(s.perGang||[])+'</div>';
 if(s.finished)return h+'<div class="gc p-4"><h3 class="font-bold text-sm text-slate-800 mb-3"><i class="fa-solid fa-trophy text-amber-500 mr-2"></i>Hasil Akhir Perolehan Suara</h3>'+bars(s.results)+'</div>'+g;
 return h+'<div class="gc p-4 text-center"><p class="text-sm font-bold text-slate-700">Pengumuman hasil dalam</p><div class="cdn" id="cd"></div></div>'+g}
function tickCd(){const s=S.st,e=$('cd');if(!s||!e||s.finished)return;const r=new Date(s.deadline).getTime()-(Date.now()+S.off);if(r<=0){loadStatus();return}
 const d=Math.floor(r/864e5),j=Math.floor(r%864e5/36e5),m=Math.floor(r%36e5/6e4),c=Math.floor(r%6e4/1e3);
 e.innerHTML=[[d,'Hari'],[j,'Jam'],[m,'Menit'],[c,'Detik']].map(x=>'<div><b>'+x[0]+'</b>'+x[1]+'</div>').join('')}
async function loadStatus(q){const r=await api('getStatus',{},true);if(!r.ok)return;S.st=r;S.off=new Date(r.now).getTime()-Date.now();if(S.view==='wait'){render()}else if(S.view==='vote'&&V.step===0)render()}

/* ===== KAMERA ===== */
async function loadLib(){if(libOK)return;await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)});await faceapi.nets.tinyFaceDetector.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model/');libOK=true}
function upd(){const b=$('bc'),m=$('msg');if(!b)return;b.disabled=!faceOK;m.innerHTML=faceOK?'<span class="text-emerald-600"><i class="fa-solid fa-circle-check mr-1"></i>Wajah terdeteksi</span>':'<span class="text-red-500">Arahkan wajah Anda ke kamera</span>'}
async function startCam(){
 faceOK=false;const m=$('msg');
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640}},audio:false});$('vid').srcObject=stream}
 catch(e){if(IS_PREVIEW){faceOK=true;upd();return}m.innerHTML='<span class="text-red-500">Kamera tidak dapat diakses. Izinkan akses kamera lalu muat ulang.</span>';return}
 m.textContent='Memuat pendeteksi wajah...';
 try{await loadLib()}catch(e){if(IS_PREVIEW){faceOK=true;upd();return}m.innerHTML='<span class="text-red-500">Gagal memuat pendeteksi wajah. Periksa koneksi.</span>';return}
 upd();loop=setInterval(async()=>{const v=$('vid');if(!v||v.readyState<2)return;const r=await faceapi.detectSingleFace(v,new faceapi.TinyFaceDetectorOptions({inputSize:224,scoreThreshold:.5}));faceOK=!!r;upd()},500)}
function stopCam(){clearInterval(loop);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
function shot(){const v=$('vid'),c=document.createElement('canvas');
 if(v&&v.videoWidth){c.width=480;c.height=480*v.videoHeight/v.videoWidth;const x=c.getContext('2d');x.translate(c.width,0);x.scale(-1,1);x.drawImage(v,0,0,c.width,c.height)}
 else{c.width=480;c.height=360;const x=c.getContext('2d');x.fillStyle='#888';x.fillRect(0,0,480,360);x.fillStyle='#fff';x.font='28px sans-serif';x.fillText('FOTO PREVIEW',140,190)}
 V.photo=c.toDataURL('image/jpeg',.7);stopCam();render()}

/* ===== VIEW ADMIN ===== */
function vLogin(){return '<div class="gc p-6 mt-6"><div class="text-center mb-5"><div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-3"><i class="fa-solid fa-user-tie text-2xl text-teal-600"></i></div><h2 class="text-xl font-bold text-slate-800">Login Panitia</h2></div><label class="fl" style="margin-top:0">Username</label><input class="inp" id="lu" autocomplete="username"><label class="fl">Password</label><input class="inp" id="lp" type="password" autocomplete="current-password"><button class="btn mt-4" data-a="login">LOGIN</button></div>'}
function vAdmin(){
 const a=S.ad;if(!a)return '<div class="gc p-6 text-center text-sm text-slate-500"><i class="fa-solid fa-spinner fa-spin text-teal-600 mr-2"></i>Memuat...</div>';
 if(S.tab==='dash')return '<div class="gc p-5 text-center"><p class="text-[10px] uppercase tracking-wide font-bold text-slate-400">Total Suara</p><p class="text-5xl font-extrabold text-teal-600 mt-1">'+a.total+'</p></div><div class="gc p-4"><h3 class="font-bold text-sm text-slate-800 mb-3">Perolehan Sementara</h3>'+bars(a.results)+'</div><div class="gc p-4"><h3 class="font-bold text-sm text-slate-800 mb-3">Suara Masuk per Gang</h3>'+bars(a.perGang)+'</div><button class="btn sec" data-a="refresh"><i class="fa-solid fa-rotate"></i>Muat Ulang Data</button><button class="btn dg" data-a="logout"><i class="fa-solid fa-right-from-bracket"></i>Keluar</button>';
 if(S.tab==='calon'){const e=S.ef;return T('Data Calon','Manajemen')+'<div class="gc p-4"><h3 class="font-bold text-sm text-slate-800">'+(e.id?'Edit Calon':'Tambah Calon')+'</h3><label class="fl">Nama</label><input class="inp" id="cn" value="'+esc(e.nama||'')+'"><label class="fl">Visi Misi</label><textarea class="inp" id="cv">'+esc(e.visi||'')+'</textarea><label class="fl">Foto</label><input class="inp" id="cf" type="file" accept="image/*">'+(e.fotoData||e.foto?'<img class="av mt-2" style="width:80px;height:80px" src="'+esc(e.fotoData||e.foto)+'" alt="">':'')+'<div class="grid grid-cols-'+(e.id?2:1)+' gap-2 mt-3"><button class="btn" data-a="savecalon"><i class="fa-solid fa-check"></i>Simpan</button>'+(e.id?'<button class="btn sec" data-a="cancel">Batal</button>':'')+'</div></div>'+a.calon.map(c=>'<div class="gc p-3 flex gap-3"><img class="av" style="width:64px;height:64px" src="'+esc(c.foto)+'" alt=""><div class="min-w-0 flex-1"><h3 class="font-bold text-sm text-slate-800">'+esc(c.nama)+'</h3><p class="text-xs text-slate-500 mt-1" style="white-space:pre-line">'+esc(c.visi)+'</p><div class="mt-2 flex gap-2"><button class="btn sm" style="background:#eff6ff;color:#2563eb;box-shadow:none" data-a="editcalon" data-id="'+esc(c.id)+'"><i class="fa-solid fa-pen"></i>Edit</button><button class="btn sm" style="background:#fef2f2;color:#dc2626;box-shadow:none" data-a="delcalon" data-id="'+esc(c.id)+'"><i class="fa-solid fa-trash-can"></i>Hapus</button></div></div></div>').join('')}
 if(S.tab==='gang')return T('Data Gang','Manajemen')+'<div class="gc p-4"><label class="fl" style="margin-top:0">Nama Gang Baru</label><input class="inp" id="gn" placeholder="Contoh: Gang Dahlia"><button class="btn mt-3" data-a="addgang"><i class="fa-solid fa-plus"></i>Tambah</button></div>'+a.gang.map(g=>'<div class="gc p-3 flex items-center justify-between"><span class="font-bold text-sm text-slate-800"><i class="fa-solid fa-house-flag text-teal-600 mr-2"></i>'+esc(g)+'</span><button class="btn sm" style="background:#fef2f2;color:#dc2626;box-shadow:none" data-a="delgang" data-n="'+esc(g)+'"><i class="fa-solid fa-trash-can"></i></button></div>').join('');
 if(S.tab==='log')return T('Log Pemilih ('+a.log.length+')','Riwayat Suara')+'<div class="gc p-3 overflow-x-auto"><table class="tbl"><tr class="text-slate-400"><th>Waktu</th><th>Nama</th><th>Gang</th><th>No</th><th>WhatsApp</th><th>Pilihan</th><th>Foto</th></tr>'+a.log.map(l=>'<tr><td>'+esc(l.ts)+'</td><td>'+esc(l.nama)+'</td><td>'+esc(l.gang)+'</td><td>'+esc(l.rumah)+'</td><td>'+esc(l.wa)+'</td><td>'+esc(l.calon)+'</td><td><a class="text-teal-600 font-bold" href="'+esc(l.foto)+'" target="_blank" rel="noopener">Lihat</a></td></tr>').join('')+'</table></div>';
 return T('Pengaturan Waktu','Jadwal')+'<div class="gc p-4"><label class="fl" style="margin-top:0">Waktu Pengumuman Hasil (juga batas akhir voting)</label><input class="inp" id="wt" type="datetime-local" value="'+localInput(a.deadline)+'"><button class="btn mt-3" data-a="savewaktu"><i class="fa-solid fa-floppy-disk"></i>Simpan Waktu</button></div>'}
async function loadAdmin(){const r=await api('adminData');if(!r.ok){S.token='';toast(r.msg||'Sesi berakhir');go('login');return}S.ad=r;render()}

/* ===== AKSI ===== */
document.addEventListener('click',e=>{
 const g=e.target.closest('#app-container [data-g]');if(g)return go(g.dataset.g==='login'&&S.token?'admin':g.dataset.g);
 const t=e.target.closest('#app-container [data-t]');if(t){S.tab=t.dataset.t;S.ef={};return render()}
 if(e.target.id==='sheet')return closeSheet();
 const b=e.target.closest('#app-container [data-a]');if(b)act(b.dataset.a,b)});
async function act(a,b){
 const v=id=>{const e=$(id);return e?e.value.trim():''};
 if(a==='tovote')return go('vote');if(a==='towait')return go('wait');
 if(a==='start'){V.step=1;V.photo='';return render()}
 if(a==='review'){V.nama=v('fn');V.gang=v('fg');V.rumah=v('fr');V.wa=v('fw');const c=document.querySelector('#main [name=fc]:checked');V.calon=c?c.value:'';
  if(V.nama.length<3)return toast('Isi nama lengkap Anda.');
  if(!V.gang||!V.rumah||!V.calon)return toast('Lengkapi gang, nomor rumah, dan pilihan calon.');
  if(!normWA(V.wa))return toast('Nomor WhatsApp tidak valid (contoh 081234567890).');
  V.step=3;return render()}
 if(a==='tofrm'||a==='edit'){V.step=2;return render()}
 if(a==='back'){stopCam();V.step=(V.step===2?1:0);return render()}
 if(a==='shot')return shot();
 if(a==='retake'){V.photo='';return render()}
 if(a==='send')return sheet('<div class="text-center"><div class="w-14 h-14 mx-auto rounded-full bg-amber-100 text-amber-600 flex items-center justify-center text-2xl mb-3"><i class="fa-solid fa-triangle-exclamation"></i></div><h3 class="font-bold text-lg text-slate-800">Kirim Suara?</h3><p class="text-xs text-slate-500 mt-1 mb-5">Apakah pilihan Anda sudah benar? Suara yang sudah dikirim <b>tidak dapat diubah</b>.</p></div><div class="grid grid-cols-2 gap-3"><button class="btn sec" data-a="closesheet">Periksa Lagi</button><button class="btn" data-a="dosend"><i class="fa-solid fa-paper-plane"></i>Ya, Kirim</button></div>');
 if(a==='closesheet')return closeSheet();
 if(a==='dosend'){closeSheet();const r=await api('submitVote',{nama:V.nama,gang:V.gang,rumah:V.rumah,wa:V.wa,calon:V.calon,foto:V.photo});
  if(r.ok){V.step=4;V.photo='';V.nama=V.gang=V.rumah=V.wa=V.calon='';render()}else toast(r.msg||'Gagal mengirim suara');return}
 if(a==='login'){const r=await api('adminLogin',{u:v('lu'),p:$('lp').value});if(!r.ok)return toast(r.msg||'Login gagal');S.token=r.token;S.view='admin';S.tab='dash';S.ad=null;render();return loadAdmin()}
 if(a==='logout'){S.token='';S.ad=null;return go('home')}
 if(a==='refresh')return loadAdmin();
 if(a==='cancel'){S.ef={};return render()}
 if(a==='editcalon'){S.ef=Object.assign({},S.ad.calon.find(c=>c.id==b.dataset.id));return render()}
 if(a==='savecalon'){const n=v('cn');if(!n)return toast('Nama calon wajib diisi.');const f=$('cf').files[0];const fd=f?await readImg(f,480):(S.ef.fotoData||'');
  const r=await api('saveCalon',{id:S.ef.id||'',nama:n,visi:v('cv'),fotoData:fd});toast(r.ok?'Calon tersimpan':r.msg);if(r.ok){S.ef={};await loadPublic();loadAdmin()}return}
 if(a==='delcalon'){if(!confirm('Hapus calon ini?'))return;const r=await api('deleteCalon',{id:b.dataset.id});toast(r.ok?'Calon dihapus':r.msg);if(r.ok){await loadPublic();loadAdmin()}return}
 if(a==='addgang'){const n=v('gn');if(!n)return toast('Isi nama gang.');const r=await api('addGang',{nama:n});toast(r.ok?'Gang ditambahkan':r.msg);if(r.ok){await loadPublic();loadAdmin()}return}
 if(a==='delgang'){if(!confirm('Hapus gang ini?'))return;const r=await api('deleteGang',{nama:b.dataset.n});toast(r.ok?'Gang dihapus':r.msg);if(r.ok){await loadPublic();loadAdmin()}return}
 if(a==='savewaktu'){const t=v('wt');if(!t)return toast('Pilih tanggal dan jam.');const r=await api('saveSetting',{key:'WaktuPengumuman',value:new Date(t).toISOString()});toast(r.ok?'Waktu tersimpan':r.msg);if(r.ok)loadAdmin()}
}
async function loadPublic(){const r=await api('getPublic',{},true);if(r.ok){S.calon=r.calon;S.gang=r.gang}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopCam()});
(async function(){
 $('hd').textContent=new Intl.DateTimeFormat('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'Asia/Jakarta'}).format(new Date());
 loading(true);await loadPublic();loading(false);render()})();
})();
</script>
