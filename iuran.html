<script>
//<![CDATA[
// KONFIGURASI APLIKASI
// UBAH IS_PREVIEW KE false JIKA AKAN DI-DEPLOY KE BLOGGER
const IS_PREVIEW = true; // Set default true untuk Canvas
const GAS_URL = "URL_DEPLOY_GAS_ANDA_DISINI";
// Alamat halaman aplikasi yang dibuka warga (link jadi: PUBLIC_URL + "?p=idrumah"). Kosongkan untuk memakai alamat halaman ini.
const PUBLIC_URL = "https://budd1qc.github.io/dtar/iuran.html";

const BLNF=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const BLN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const THN=new Date().getFullYear(),BLNNOW=new Date().getMonth()+1;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rp=n=>'Rp '+Number(n||0).toLocaleString('id-ID');
const mask=n=>{n=String(n||'');return n.length<=3?n.charAt(0)+'**':n.slice(0,2)+'***'+n.slice(-1)};
const cmp=(a,b)=>a.gang.localeCompare(b.gang)||a.idrumah.localeCompare(b.idrumah,undefined,{numeric:true});
let D=null,TOKEN='',USER=null,DB=null,PIDX=null;
let S={menu:'dash',tahun:THN,gang:'',tab:'gang',payId:'',payB:[],q:''};
const MENU=[['dash','Dashboard'],['iuran','Iuran Bulanan'],['bayar','Pembayaran'],['tunggak','Tunggakan'],['riwayat','Riwayat Pembayaran'],['rekap','Rekap Tahunan'],['master','Data Blok/Rumah']];

const CFG={
 gang:{t:'Gang',keys:['nama'],f:[{k:'nama',l:'Nama Gang'}]},
 rumah:{t:'Rumah',keys:['idrumah'],f:[{k:'idrumah',l:'ID Rumah (mis. K1)'},{k:'gang',l:'Gang',o:()=>D.gang.map(g=>g.nama)},{k:'norumah',l:'No Rumah'},{k:'nama_pemilik',l:'Nama Pemilik'},{k:'no_telp',l:'No Telp'},{k:'status',l:'Status Rumah',o:()=>statusList()}]},
 periode:{t:'Periode',keys:['tahun'],f:[{k:'tahun',l:'Tahun',n:1},{k:'status',l:'Status',o:()=>['aktif','tutup']}]},
 tarif:{t:'Tarif',keys:['tahun','status_rumah'],f:[{k:'tahun',l:'Tahun',n:1,o:()=>tahunList()},{k:'status_rumah',l:'Status Rumah (mis. ditempati)'},{k:'nominal',l:'Nominal / bulan',n:1}]},
 admin:{t:'Admin',keys:['id'],f:[{k:'id',l:'ID Login'},{k:'pass',l:'Password',p:1},{k:'nama',l:'Nama'},{k:'role',l:'Role',o:()=>['bendahara','pengurus']}]}
};

/* ===== DATA DUMMY & BACKEND PALSU (khusus mode preview) ===== */
function buildDB(){
 const G={MATAHARI:'K1 ISMAN,K2 DWI,K3 AHMAD KHOIRI,K4 RASI,K5 SUDARMANTO,K6 NISA',ANGREEK:'I3 ZAINUL HASAN,I4 ARIF,I5 PUTU,I6 SONDRA',SAKURA:'J2 JUNAIDI,J3 JAZIL,J5 ROSID,J6 MANSUR,J7 RIAWATI'};
 const db={gang:[],rumah:[],periode:[{tahun:THN-1,status:'tutup'},{tahun:THN,status:'aktif'}],tarif:[],iuran:[],
  admin:[{id:'admin',pass:'edudigital',nama:'Bendahara',role:'bendahara'},{id:'peserta',pass:'edudigital',nama:'Pengurus',role:'pengurus'}]};
 let i=0;
 for(const g in G){db.gang.push({nama:g});G[g].split(',').forEach(s=>{const id=s.split(' ')[0],nm=s.slice(id.length+1);i++;
  db.rumah.push({idrumah:id,gang:g,norumah:id.slice(1),nama_pemilik:nm,no_telp:'0812000000'+(10+i),status:i%7==3?'kosong':(i%5==2?'dikontrakkan':'ditempati')})})}
 [THN-1,THN].forEach(t=>{db.tarif.push({tahun:t,status_rumah:'ditempati',nominal:100000},{tahun:t,status_rumah:'kosong',nominal:50000},{tahun:t,status_rumah:'dikontrakkan',nominal:150000})});
 db.rumah.forEach((r,k)=>{[THN-1,THN].forEach(t=>{
  const mx=t<THN?12:BLNNOW-(k%4==0?3:(k%5==0?1:0));
  for(let b=1;b<=mx;b++){if(t<THN&&k%6==0&&b>10)continue;
   const n=db.tarif.find(x=>x.tahun==t&&x.status_rumah==r.status).nominal,m=String(b).padStart(2,'0');
   db.iuran.push({id:'D'+t+r.idrumah+b,tanggal:t+'-'+m+'-05',gang:r.gang,idrumah:r.idrumah,nama:r.nama_pemilik,periode:t,status_rumah:r.status,bulan:b,nominal:n,metode:k%2?'Transfer':'Tunai',created_at:t+'-'+m+'-05T08:00:00',status_bayar:'aktif'})}})});
 db.iuran[2].status_bayar='batal';
 return db;
}
function newTrx(){const d=new Date(),z=n=>String(n).padStart(2,'0');return 'TRX-'+d.getFullYear()+z(d.getMonth()+1)+z(d.getDate())+'-'+z(d.getHours())+z(d.getMinutes())+z(d.getSeconds())+'-'+Math.floor(100+Math.random()*900)}
function mock(a,p){
 if(a==='login'){const u=DB.admin.find(x=>x.id===p.user&&x.pass===p.pass);
  return u?{ok:true,token:'prev-'+u.id,user:{id:u.id,nama:u.nama,role:u.role}}:{ok:false,msg:'Username atau password salah'}}
 if(a==='publicView'){const r=DB.rumah.find(x=>x.idrumah.toLowerCase()===String(p.p).trim().toLowerCase());
  if(!r)return{ok:false,msg:'Rumah dengan ID "'+esc(p.p)+'" tidak ditemukan'};
  const tf=DB.tarif.find(x=>+x.tahun===THN&&x.status_rumah===r.status);
  return{ok:true,tahun:THN,bulanKini:BLNNOW,nominal:tf?tf.nominal:0,rumah:{idrumah:r.idrumah,gang:r.gang,norumah:r.norumah,nama:mask(r.nama_pemilik),status:r.status},
   iuran:DB.iuran.filter(i=>i.idrumah===r.idrumah&&+i.periode===THN&&i.status_bayar==='aktif').map(i=>({bulan:i.bulan,tanggal:i.tanggal,nominal:i.nominal,metode:i.metode}))}}
 const me=DB.admin.find(x=>'prev-'+x.id===p.token);
 if(!me)return{ok:false,msg:'Sesi berakhir, silakan login ulang'};
 if(a==='getAll')return{ok:true,gang:DB.gang,rumah:DB.rumah,periode:DB.periode,tarif:DB.tarif,iuran:DB.iuran,admin:me.role==='bendahara'?DB.admin.map(x=>({id:x.id,nama:x.nama,role:x.role})):[]};
 if(me.role!=='bendahara')return{ok:false,msg:'Akses ditolak (hanya bendahara)'};
 if(a==='savePayment'){
  const r=DB.rumah.find(x=>x.idrumah===p.idrumah),pr=DB.periode.find(x=>+x.tahun===+p.tahun);
  if(!r||!pr)return{ok:false,msg:'Rumah/periode tidak valid'};
  if(pr.status==='tutup')return{ok:false,msg:'Periode '+p.tahun+' sudah ditutup'};
  const tf=DB.tarif.find(x=>+x.tahun===+p.tahun&&x.status_rumah===r.status);
  if(!tf)return{ok:false,msg:'Tarif status "'+r.status+'" tahun '+p.tahun+' belum diatur'};
  for(const b of p.bulan)if(DB.iuran.some(i=>i.idrumah===r.idrumah&&+i.periode===+p.tahun&&+i.bulan===b&&i.status_bayar==='aktif'))return{ok:false,msg:'Bulan '+BLN[b-1]+' sudah dibayar'};
  const trx=newTrx();p.bulan.forEach(b=>DB.iuran.push({id:trx+'-'+String(b).padStart(2,'0'),tanggal:p.tanggal,gang:r.gang,idrumah:r.idrumah,nama:r.nama_pemilik,periode:+p.tahun,status_rumah:r.status,bulan:b,nominal:+tf.nominal,metode:p.metode,created_at:new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,19),status_bayar:'aktif'}));
  return{ok:true,trx:trx}}
 if(a==='cancelPayment'){const x=DB.iuran.find(i=>i.id===p.id);if(!x)return{ok:false,msg:'Data tidak ditemukan'};x.status_bayar='batal';return{ok:true}}
 if(a==='saveRow'||a==='delRow'){
  const c=CFG[p.sheet],arr=DB[p.sheet],idx=arr.findIndex(x=>c.keys.every(k=>String(x[k])===String(p.row[k])));
  if(a==='delRow'){if(idx<0)return{ok:false,msg:'Data tidak ditemukan'};arr.splice(idx,1);return{ok:true}}
  if(p.isNew){if(idx>=0)return{ok:false,msg:'Data dengan kunci tersebut sudah ada'};arr.push(p.row)}
  else{if(idx<0)return{ok:false,msg:'Data tidak ditemukan'};if(p.sheet==='admin'&&!p.row.pass)p.row.pass=arr[idx].pass;arr[idx]=p.row}
  return{ok:true}}
 return{ok:false,msg:'Aksi tidak dikenal'};
}
async function api(a,p){
 p=p||{};p.action=a;p.token=TOKEN;
 try{
  if(IS_PREVIEW){await new Promise(r=>setTimeout(r,120));return JSON.parse(JSON.stringify(mock(a,JSON.parse(JSON.stringify(p)))))}
  const r=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)});
  return await r.json();
 }catch(e){return{ok:false,msg:'Gagal terhubung ke server: '+e}}
}

/* ===== UTIL ===== */
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3200)}
const canEdit=()=>USER&&USER.role==='bendahara';
const tahunList=()=>D.periode.map(x=>+x.tahun).sort((a,b)=>b-a);
const statusList=()=>[...new Set(D.tarif.map(x=>x.status_rumah))];
const tarifOf=(t,st)=>{const x=D.tarif.find(r=>+r.tahun===+t&&r.status_rumah===st);return x?+x.nominal:null};
const lunas=(id,t,b)=>{if(!PIDX){PIDX=new Map();D.iuran.forEach(r=>{if(r.status_bayar==='aktif')PIDX.set(r.idrumah+'|'+r.periode+'|'+r.bulan,r)})}return PIDX.get(id+'|'+t+'|'+b)};
const pubLink=id=>(PUBLIC_URL||(location.origin+location.pathname))+'?p='+encodeURIComponent(String(id).toLowerCase());
function idLink(id){const st='color:#1d4ed8;font-weight:700;text-decoration:underline';
 return IS_PREVIEW?'<a href="#" style="'+st+'" title="Buka halaman warga" onclick="showPublic(\''+esc(id)+'\');return false">'+esc(id)+'</a>'
 :'<a href="'+esc(pubLink(id))+'" target="_blank" rel="noopener" style="'+st+'" title="'+esc(pubLink(id))+'">'+esc(id)+'</a>'}
function salin(id){const u=pubLink(id);if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(u).then(()=>toast('Link disalin: '+u),()=>prompt('Salin link:',u));else prompt('Salin link:',u)}
const sampai=t=>+t<THN?12:(+t===THN?BLNNOW:0);
function tunggak(r,t){const n=tarifOf(t,r.status)||0,m=[];for(let b=1;b<=sampai(t);b++)if(!lunas(r.idrumah,t,b))m.push(b);return{m:m,total:m.length*n}}
function usedBy(sh,row){
 if(sh==='gang')return D.rumah.some(r=>r.gang===row.nama);
 if(sh==='rumah')return D.iuran.some(r=>r.idrumah===row.idrumah);
 if(sh==='periode')return D.iuran.some(r=>+r.periode===+row.tahun)||D.tarif.some(r=>+r.tahun===+row.tahun);
 if(sh==='tarif')return D.iuran.some(r=>+r.periode===+row.tahun&&r.status_rumah===row.status_rumah);
 return sh==='admin'&&row.id===USER.id;
}
function bar(t,g){
 const ths=S.menu==='master'?'':'<select onchange="S.tahun=+this.value;S.payB=[];render()">'+tahunList().map(y=>'<option '+(y==S.tahun?'selected':'')+'>'+y+'</option>').join('')+'</select>';
 const gs=g?'<select onchange="S.gang=this.value;render()"><option value="">Semua gang</option>'+D.gang.map(x=>'<option '+(x.nama===S.gang?'selected':'')+'>'+esc(x.nama)+'</option>').join('')+'</select>':'';
 return '<div class="bar"><h2>'+t+'</h2>'+ths+gs+'</div>';
}

/* ===== LOGIN / SESI ===== */
function showLogin(){
 $('#view').innerHTML='<div class="top"><b>Iuran Warga Perumahan'+(IS_PREVIEW?' (Preview)':'')+'</b></div><div class="login"><div class="card"><h3 style="margin-top:0">Login Bendahara</h3>'
 +'<input id="lu" placeholder="Username" autocomplete="username" value="'+(IS_PREVIEW?'admin':'')+'"><input id="lp" type="password" placeholder="Password" autocomplete="current-password" value="'+(IS_PREVIEW?'edudigital':'')+'" onkeydown="if(event.key===\'Enter\')doLogin()">'
 +'<button style="width:100%" onclick="doLogin()">Masuk</button>'
 +(IS_PREVIEW?'<button class="gray" style="width:100%;margin-top:8px" onclick="loginAs(\'peserta\')">Masuk sebagai Pengurus (hanya lihat)</button><hr style="margin:14px 0;border:0;border-top:1px solid #e2e8f0"><p style="font-size:12px;color:#64748b;margin:0 0 8px">Mode Preview (data dummy). Kolom login sudah terisi, tinggal klik Masuk.</p><p style="margin:0 0 6px;font-weight:600;font-size:13px">Coba tampilan warga:</p><input id="dp" placeholder="ID rumah, mis. K1" style="margin-bottom:6px"><button class="gray" style="width:100%" onclick="showPublic($(\'#dp\').value)">Lihat Iuran Warga</button>':'')
 +'</div></div>';
}
function loginAs(u){$('#lu').value=u;$('#lp').value='edudigital';doLogin()}
async function doLogin(){
 const r=await api('login',{user:$('#lu').value.trim(),pass:$('#lp').value});
 if(!r.ok)return toast(r.msg||'Login gagal');
 TOKEN=r.token;USER=r.user;
 try{sessionStorage.setItem('iw',JSON.stringify({t:TOKEN,u:USER}))}catch(e){}
 if(await load())shell();
}
function logout(){TOKEN='';USER=null;D=null;try{sessionStorage.removeItem('iw')}catch(e){}showLogin()}
async function load(){
 const r=await api('getAll');
 if(!r.ok){logout();toast(r.msg||'Gagal memuat data');return false}
 D=r;PIDX=null;
 if(!tahunList().includes(S.tahun))S.tahun=tahunList()[0]||THN;
 if(!S.payId&&D.rumah.length)S.payId=[...D.rumah].sort(cmp)[0].idrumah;
 return true;
}
function shell(){
 $('#view').innerHTML='<div class="top"><button id="hb" onclick="$(\'.nav\').classList.toggle(\'open\')">☰</button><b>Iuran Warga'+(IS_PREVIEW?' (Preview)':'')+'</b><span>'+esc(USER.nama)+' · '+USER.role+'</span><button onclick="logout()">Keluar</button></div>'
 +'<div class="wrap"><div class="nav">'+MENU.map(m=>'<a id="m_'+m[0]+'" onclick="go(\''+m[0]+'\')">'+m[1]+'</a>').join('')+'</div><div class="main" id="main"></div></div>';
 render();
}
function go(m){S.menu=m;$('.nav').classList.remove('open');render()}
function render(){
 MENU.forEach(m=>{const a=$('#m_'+m[0]);if(a)a.className=S.menu===m[0]?'on':''});
 $('#main').innerHTML=({dash:vDash,iuran:vIuran,bayar:vBayar,tunggak:vTung,riwayat:vRiw,rekap:vRekap,master:vMaster})[S.menu]();
 if(S.menu==='bayar'&&canEdit()&&D.rumah.length)pm();
}

/* ===== DASHBOARD ===== */
function vDash(){
 const t=S.tahun;let tot=0,tg=0,tgR=0,target=0;
 D.iuran.forEach(r=>{if(+r.periode===+t&&r.status_bayar==='aktif')tot+=+r.nominal});
 D.rumah.forEach(r=>{const n=tarifOf(t,r.status)||0;let m=0;for(let b=1;b<=sampai(t);b++){target+=n;if(!lunas(r.idrumah,t,b)){tg+=n;m++}}if(m)tgR++});
 const pct=target?Math.round((target-tg)/target*100):0;
 return bar('Dashboard')+'<div class="cards"><div class="card"><small>Total terkumpul</small><b>'+rp(tot)+'</b></div><div class="card"><small>Total tunggakan s/d bulan ini</small><b class="neg">'+rp(tg)+'</b></div><div class="card"><small>Rumah menunggak</small><b>'+tgR+' / '+D.rumah.length+'</b></div><div class="card"><small>Tingkat pelunasan</small><b>'+pct+'%</b></div></div>'
 +'<div class="card">Periode <b>'+t+'</b> · Bulan berjalan: <b>'+(sampai(t)?BLN[sampai(t)-1]:'-')+'</b>. Gunakan menu di samping untuk mencatat pembayaran dan memantau tunggakan.</div>';
}

/* ===== IURAN BULANAN ===== */
function iuranRows(){
 const t=S.tahun,q=(S.iq||'').toLowerCase(),so=S.isort||'id';
 const L=D.rumah.filter(r=>(!S.gang||r.gang===S.gang)&&(!q||(r.idrumah+' '+r.nama_pemilik).toLowerCase().includes(q))).map(r=>({r:r,tg:tunggak(r,t).m.length}));
 L.sort((a,b)=>so==='nama'?a.r.nama_pemilik.localeCompare(b.r.nama_pemilik):so==='status'?(a.r.status.localeCompare(b.r.status)||cmp(a.r,b.r)):so==='tung'?(b.tg-a.tg||cmp(a.r,b.r)):so==='lunas'?(a.tg-b.tg||cmp(a.r,b.r)):cmp(a.r,b.r));
 return L;
}
function iuranTbl(){
 const t=S.tahun,L=iuranRows();
 let h='<table><tr><th>Rumah</th><th>Nama</th><th>Status</th>'+BLN.map(b=>'<th>'+b+'</th>').join('')+'<th title="Jumlah bulan menunggak">Tgk</th></tr>';

  if(p){tot+=+p.nominal;rows+='<tr><td>'+BLN[b-1]+'</td><td><span class="tag g">Lunas</span></td><td>'+esc(p.tanggal)+'</td><td>'+rp(p.nominal)+'</td><td>'+esc(p.metode)+'</td></tr>'}
  else if(b<=r.bulanKini){tg+=+r.nominal;tm.push(BLN[b-1]);rows+='<tr><td>'+BLN[b-1]+'</td><td><span class="tag r">Belum bayar</span></td><td>-</td><td>'+rp(r.nominal)+'</td><td>-</td></tr>'}
  else rows+='<tr><td>'+BLN[b-1]+'</td><td><span class="tag">Belum jatuh tempo</span></td><td>-</td><td>-</td><td>-</td></tr>'}
 h+='<div class="card"><h3 style="margin:0 0 6px">Rumah '+esc(x.idrumah)+' · Gang '+esc(x.gang)+'</h3>Pemilik: <b>'+esc(x.nama)+'</b> · Status: <b>'+esc(x.status)+'</b> · Iuran/bulan: <b>'+rp(r.nominal)+'</b><br>Periode: <b>'+r.tahun+'</b></div>'
 +'<div class="cards"><div class="card"><small>Total sudah dibayar</small><b>'+rp(tot)+'</b></div><div class="card"><small>Tunggakan s/d '+BLN[r.bulanKini-1]+'</small><b class="'+(tg?'neg':'')+'">'+rp(tg)+'</b></div></div>'
 +(tm.length?'<div class="card neg">Bulan belum dibayar: '+tm.join(', ')+'</div>':'<div class="card">Iuran Anda lunas sampai bulan berjalan. Terima kasih 🙏</div>')
 +'<div class="tw"><table><tr><th>Bulan</th><th>Status</th><th>Tanggal</th><th>Nominal</th><th>Metode</th></tr>'+rows+'</table></div></div></div>';
 $('#view').innerHTML=h;
}
